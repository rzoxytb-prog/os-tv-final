<title>Rosé OS</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#fff;--dim:rgba(255,255,255,0);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);font-size:clamp(10px,min(1.2vw,2.2vh),18px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--dim:rgba(45,0,35,.38)}}
:root[data-theme="dark"]{--dim:rgba(45,0,35,.38)}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
body{position:relative;font-family:Outfit,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:#c23d86;-webkit-tap-highlight-color:transparent;text-shadow:0 1px .8rem rgba(120,10,70,.35)}
.wall{position:fixed;inset:0;z-index:0;overflow:hidden}
.wall svg{width:100%;height:100%;display:block;transform-origin:60% 60%;animation:kb 45s ease-in-out infinite alternate;will-change:transform}
@keyframes kb{to{transform:scale(1.07)}}
.wall::after{content:"";position:absolute;inset:0;background:linear-gradient(var(--dim),var(--dim)),linear-gradient(180deg,rgba(120,10,70,.28),transparent 35%,transparent 55%,rgba(100,5,60,.42))}
.top,.wd,.chev{transition:opacity .5s,transform .7s cubic-bezier(.2,.8,.2,1)}
.gone .top,.gone .wd,.gone .chev{opacity:0;transform:translate3d(0,-1.6rem,0)}
.top{position:absolute;left:0;right:0;top:5vh;text-align:center;z-index:2}
.hi{font-size:1.15rem;font-weight:500;letter-spacing:.12em;opacity:.9}
.clk{font-size:5.6rem;font-weight:200;line-height:1.05;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.dt{font-size:1.1rem;letter-spacing:.1em;opacity:.9}
.wd{position:absolute;right:5vw;top:5vh;z-index:2;width:21rem;display:flex;align-items:center;gap:.8rem;padding:.7rem .8rem;border-radius:1.5rem;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.art{flex:none;width:3rem;height:3rem;border-radius:.8rem;background:linear-gradient(145deg,#ff6fae,#ffc27d);box-shadow:0 .4rem 1rem -.3rem rgba(120,10,70,.5)}
.wi{flex:1;min-width:0}.wi b{display:block;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.wi span{display:block;font-size:.85rem;opacity:.85}
.bar{height:.22rem;margin-top:.4rem;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;transform-origin:left;animation:pg 214s linear infinite}
.pz .bar i{animation-play-state:paused}
@keyframes pg{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.wb{flex:none;width:2.4rem;height:2.4rem;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#d6287a;font:inherit;font-size:.9rem;cursor:pointer;display:grid;place-items:center}
.lab{position:absolute;left:5vw;right:5vw;top:44vh;height:7.4rem;z-index:2}
.lab h1{margin:0;font-size:3.8rem;font-weight:300;letter-spacing:-.025em;line-height:1.1}
.lab p{margin:.3rem 0 0;font-size:1.2rem;opacity:.92;max-width:38rem;line-height:1.35}
.sw{animation:sw .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes sw{from{opacity:0;transform:translate3d(0,.9rem,0)}}
.stack{position:absolute;left:0;right:0;top:calc(44vh + 7.4rem);z-index:2;transition:transform .7s cubic-bezier(.2,.8,.2,1);will-change:transform}
.row{opacity:.65;transition:opacity .5s}.row+.row{margin-top:3.2rem}.row.cur{opacity:1}.row.past{opacity:0}
.track{display:flex;gap:1.5rem;padding:1.6rem 5vw;transition:transform .6s cubic-bezier(.2,.8,.2,1);will-change:transform}
.t{position:relative;flex:none;cursor:pointer;transition:transform .5s cubic-bezier(.2,.9,.25,1.2);will-change:transform}
.t.a{width:11.5rem;height:6.6rem}.t.w{width:15.5rem;height:8.7rem}
.in{position:absolute;inset:0;border-radius:1.1rem;overflow:hidden;background:var(--c,#c2569a)}
.in svg{width:100%;height:100%;display:block}
.in::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.34),rgba(255,255,255,0) 42%);pointer-events:none}
.t::before{content:"";position:absolute;inset:-.35rem;border-radius:1.45rem;box-shadow:0 0 0 .2rem #fff,0 1.4rem 3rem rgba(255,40,130,.65);opacity:0;transition:opacity .35s}
.t.f{transform:scale(1.14) translateZ(0);z-index:3}.t.f::before{opacity:1}
.rf{position:absolute;left:0;right:0;top:100%;height:100%;margin-top:.5rem;border-radius:1.1rem;overflow:hidden;transform:scaleY(-1);pointer-events:none;-webkit-mask-image:linear-gradient(to top,rgba(0,0,0,.3),transparent 50%);mask-image:linear-gradient(to top,rgba(0,0,0,.3),transparent 50%)}
.rf svg{width:100%;height:100%;display:block}
.tt{position:absolute;left:1rem;right:1rem;bottom:1.2rem;z-index:1;font-weight:600;font-size:1.1rem;line-height:1.15}
.pb{position:absolute;left:1rem;right:1rem;bottom:.6rem;height:.28rem;border-radius:9px;background:rgba(255,255,255,.4);z-index:1}.pb b{display:block;height:100%;border-radius:9px;background:#fff}
.nw{position:absolute;left:.8rem;top:.8rem;z-index:1;padding:.25rem .7rem;border-radius:99px;font-style:normal;font-size:.8rem;font-weight:600;background:rgba(255,255,255,.92);color:#d6287a;text-shadow:none}
.net{position:absolute;left:5vw;bottom:calc(3vh);z-index:2;display:flex;align-items:center;gap:.5rem;padding:.45rem .9rem;border-radius:99px;font-size:.95rem;background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.net::before{content:"";width:.55rem;height:.55rem;border-radius:50%;background:#ff4d6d}.net.on::before{background:#3be08a;box-shadow:0 0 .6rem #3be08a}
.chev{position:absolute;left:50%;bottom:3vh;margin-left:-1rem;z-index:2;width:2rem;opacity:.85}
.player{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;padding:5vw 6vw calc(5vw + env(safe-area-inset-bottom,0px));background:linear-gradient(150deg,#ff6fae,#ffb199);opacity:0;pointer-events:none;transform:scale(1.05);transition:opacity .45s,transform .6s cubic-bezier(.2,.8,.2,1)}
.player::before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(90,10,55,.6),transparent 60%)}
.player.on{opacity:1;pointer-events:auto;transform:none}.player>*{position:relative}
.player h3{font-size:3.4rem;margin:0;font-weight:300;letter-spacing:-.03em;line-height:1}
.player p{font-size:1.2rem;margin:.6rem 0 1.4rem;opacity:.92}
.ctl{display:flex;align-items:center;gap:1.2rem}
.pp{width:4rem;height:4rem;border-radius:50%;border:0;background:#fff;color:#e0287a;font:inherit;font-size:1.5rem;cursor:pointer;display:grid;place-items:center}
.prog{flex:1;height:.4rem;border-radius:9px;background:rgba(255,255,255,.35);overflow:hidden}.prog b{display:block;height:100%;background:#fff}
.tm{font-variant-numeric:tabular-nums;min-width:4.5rem;text-align:right}
.url{display:none;width:min(36rem,100%);margin:0 0 1rem;padding:1rem 1.4rem;border-radius:99px;border:0;font:inherit;font-size:1.2rem;color:#3a0b25;background:rgba(255,255,255,.92);text-shadow:none;-webkit-user-select:text;user-select:text}
.go{display:none;align-self:flex-start;padding:.9rem 2rem;border-radius:99px;border:0;font:inherit;font-weight:600;font-size:1.15rem;background:#fff;color:#e0287a;cursor:pointer}
.st{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:1rem;background:rgba(60,5,40,.5);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);opacity:0;pointer-events:none;transition:opacity .35s}
.st.on{opacity:1;pointer-events:auto}
.sp{width:min(42rem,100%);padding:2rem;border-radius:1.8rem;background:linear-gradient(160deg,rgba(255,150,195,.35),rgba(190,50,120,.55))}
.sp h2{margin:0 0 .6rem;font-size:2.4rem;font-weight:300}
.sr{display:flex;align-items:center;justify-content:space-between;gap:1.2rem;width:100%;margin-top:.8rem;padding:1.1rem 1.3rem;border:0;border-radius:1.2rem;background:rgba(255,255,255,.14);color:#fff;font:inherit;text-align:left;cursor:pointer;text-shadow:none;transition:transform .3s cubic-bezier(.2,.9,.25,1.2),background .3s}
.sr:focus{outline:none;background:rgba(255,255,255,.3);box-shadow:0 0 0 .2rem #fff;transform:scale(1.02)}
.sr b{display:block;font-weight:600;font-size:1.2rem}.sr small{display:block;margin-top:.2rem;font-size:.95rem;opacity:.9}
.tg{flex:none;width:3.4rem;height:1.9rem;border-radius:99px;background:rgba(255,255,255,.35);position:relative;transition:background .3s}
.tg i{position:absolute;left:.2rem;top:.2rem;width:1.5rem;height:1.5rem;border-radius:50%;background:#fff;transition:transform .3s cubic-bezier(.2,.9,.25,1.2)}
.sr.on .tg{background:#3be08a}.sr.on .tg i{transform:translateX(1.5rem)}
.ex{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.5rem;padding:2rem;text-align:center;background:#0b0b0e;opacity:0;pointer-events:none;transition:opacity .5s}
.ex.on{opacity:1;pointer-events:auto}.ex p{max-width:32rem;margin:0;font-size:1.3rem;line-height:1.4;font-weight:300}.ex .go{align-self:center}
.gear{position:absolute;left:5vw;top:5vh;z-index:3;width:3rem;height:3rem;border:0;border-radius:50%;color:#fff;font:inherit;font-size:1.5rem;line-height:1;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.22);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);text-shadow:none;transition:opacity .5s,transform .3s cubic-bezier(.2,.9,.25,1.2)}
.gear:active{transform:scale(.92)}.gone .gear{opacity:0;pointer-events:none}.perf .gear{-webkit-backdrop-filter:none;backdrop-filter:none;background:rgba(185,45,115,.78)}
.perf{text-shadow:none}
.perf .wall svg,.perf .sw,.perf .bar i{animation:none}.perf .wall g{filter:none}
.perf .rf,.perf .in::after{display:none}
.perf .t::before{box-shadow:0 0 0 .2rem #fff}
.perf .wd,.perf .net,.perf .st{-webkit-backdrop-filter:none;backdrop-filter:none}
.perf .wd,.perf .net{background:rgba(185,45,115,.78)}.perf .st{background:rgba(60,5,40,.95)}
.perf .stack,.perf .track{transition-duration:.3s}.perf .t{transition:transform .16s ease-out}.perf .row{transition:none}
@media (max-width:640px){.wd{display:none}.clk{font-size:4.6rem}.lab h1{font-size:3.2rem}}
@media (prefers-reduced-motion:reduce){.wall svg,.bar i{animation:none}*{transition-duration:.01s!important;animation-duration:.01s!important}}
:focus-visible{outline:.2rem solid #fff;outline-offset:.2rem}
</style>
</head>

stack.innerHTML=`<div class="row"><div class="track">${A.map(a=>`<div class="t a"><div class="in" style="--c:${a[2]}">${a[3]}</div><div class="rf">${a[3]}</div></div>`).join("")}</div></div><div class="row"><div class="track">${W.map(w=>`<div class="t w"><div class="in" style="background:linear-gradient(145deg,${w[3]},${w[4]})"><span class="tt">${w[0]}</span><em class="nw">${w[6]}</em></div></div>`).join("")}</div></div><div class="row"><div class="track">${B.map(a=>`<div class="t a"><div class="in" style="--c:${a[2]}">${a[3]}</div><div class="rf">${a[3]}</div></div>`).join("")}</div></div>`;
const rows=[...stack.children],tracks=rows.map(x=>x.firstChild),tiles=tracks.map(t=>[...t.children]);
let r=0,c=[0,0,0],last=null,open=false,playing=true,pos=0,timer=null,swiped=false,sx=null,sy;
const cur=()=>r===1?{t:W[c[1]][0],p:W[c[1]][1]+" · "+W[c[1]][2]}:r===2?{t:B[c[2]][0],p:"Ouvre directement "+B[c[2]][4].replace("https://","")}:{t:A[c[0]][0],p:A[c[0]][1]};
function go(){
 rows.forEach((el,i)=>{el.classList.toggle("cur",i===r);el.classList.toggle("past",i<r)});
 tiles.forEach((l,i)=>l.forEach((t,j)=>t.classList.toggle("f",i===r&&j===c[i])));
 stack.style.transform=`translate3d(0,${-(rows[r].offsetTop-rows[0].offsetTop)}px,0)`;
 tracks.forEach((tr,i)=>{const t=tiles[i][c[i]];tr.style.transform=`translate3d(${-Math.max(0,t.offsetLeft-innerWidth*.3)}px,0,0)`});
 document.body.classList.toggle("gone",r>0);
 const d=cur(),k=d.t+d.p;
 if(last!==k){last=k;$("lt").textContent=d.t;$("ld").textContent=d.p;const s=$("sw");s.classList.remove("sw");void s.offsetWidth;s.classList.add("sw")}
}
function move(dr,dc){if(dr)r=Math.max(0,Math.min(2,r+dr));if(dc)c[r]=Math.max(0,Math.min(tiles[r].length-1,c[r]+dc));go()}
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function draw(){$("pg").style.width=Math.min(100,pos/54)+"%";$("tm").textContent=fmt(pos)}
function openP(){
 if(r===2){OP(B[c[2]][4]);return}
 if(r===0&&A[c[0]][0]==="Réglages"){openSet();return}
 const app=r===0,br=app&&A[c[0]][0]==="Navigateur",d=app?A[c[0]]:W[c[1]],url=app?d[4]:d[7];
 open=true;playing=true;pos=app?0:d[5]*54;
 $("pt").textContent=d[0];$("ps").textContent=app?d[1]:d[1]+" · "+d[2];
 $("pl").style.background=app?"":`linear-gradient(150deg,${d[3]},${d[4]})`;
 $("pc").style.display="none";$("go").style.display=url?"inline-block":"none";
 $("ur").style.display=br?"block":"none";$("go").textContent=br?"Aller":app?"Ouvrir "+d[0]:"Ouvrir sur "+d[1].split(" · ")[0];$("ur").value="";$("pp").textContent="❚❚";
 $("pl").classList.add("on");draw();clearInterval(timer);
 timer=setInterval(()=>{if(playing&&!app){pos=Math.min(5400,pos+1);draw()}},1000);
 (br?$("ur"):url?$("go"):$("pp")).focus({preventScroll:true})}
function closeP(){open=false;$("pl").classList.remove("on");clearInterval(timer)}
function toggle(){playing=!playing;$("pp").textContent=playing?"❚❚":"▶"}
function launch(){if(r===1){OP(W[c[1]][7]);return}
 const d=A[c[0]];let u=d[4];
 if(d[0]==="Navigateur"){const v=$("ur").value.trim();u=!v?d[4]:/^https?:\/\//.test(v)?v:/^[\w-]+(\.[\w-]+)+(\/.*)?$/.test(v)?"https://"+v:"https://www.google.com/search?q="+encodeURIComponent(v)}
 if(u)OP(u)}
addEventListener("keydown",e=>{const k=e.key;
 if($("ex").classList.contains("on"))return;
 if(setOpen){if(k==="Escape"||k==="Backspace")closeSet();else if(k==="ArrowDown"||k==="ArrowUp"){const b=[...document.querySelectorAll(".st .sr")],i=b.indexOf(document.activeElement);b[(i+(k==="ArrowDown"?1:-1)+b.length)%b.length].focus()}else return;e.preventDefault();return}
 if(open){if(e.target.tagName==="INPUT"){if(k==="Enter")launch();else if(k==="Escape")closeP();return}
  if(k==="Escape"||k==="Backspace")closeP();else if(k===" "||k==="Enter"){e.preventDefault();launch()}return}
 if(k==="ArrowRight")move(0,1);else if(k==="ArrowLeft")move(0,-1);else if(k==="ArrowDown")move(1,0);else if(k==="ArrowUp")move(-1,0);
 else if(k==="Enter"||k===" ")openP();else return;e.preventDefault()});
$("pp").onclick=e=>{e.stopPropagation();toggle()};
$("go").onclick=e=>{e.stopPropagation();launch()};
$("pl").onclick=e=>{if(e.target===$("pl")||e.target.tagName==="H3"||e.target.tagName==="P")closeP()};
$("wb").onclick=e=>{e.stopPropagation();const w=$("wd");w.classList.toggle("pz");$("wb").textContent=w.classList.contains("pz")?"▶":"❚❚"};
tiles.forEach((l,i)=>l.forEach((t,j)=>t.addEventListener("click",()=>{if(swiped)return;if(r===i&&c[i]===j)openP();else{r=i;c[i]=j;go()}})));
addEventListener("pointerdown",e=>{sx=e.clientX;sy=e.clientY;swiped=false});
addEventListener("pointerup",e=>{if(open||setOpen||sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;
 if(Math.max(Math.abs(dx),Math.abs(dy))>36){swiped=true;if(Math.abs(dx)>Math.abs(dy))move(0,dx<0?1:-1);else move(dy<0?1:-1,0)}sx=null});
addEventListener("resize",go);
let setOpen=false;
function setPerf(v){document.body.classList.toggle("perf",v);$("pf").classList.toggle("on",v);$("pf").setAttribute("aria-checked",v);try{localStorage.setItem("rose-perf",v?"1":"0")}catch(e){}}
function openSet(){setOpen=true;$("st").classList.add("on");$("pf").focus({preventScroll:true})}
function closeSet(){setOpen=false;$("st").classList.remove("on")}
$("pf").onclick=()=>setPerf(!document.body.classList.contains("perf"));
$("gear").onclick=e=>{e.stopPropagation();openSet()};
$("sc").onclick=closeSet;
$("st").onclick=e=>{if(e.target===$("st"))closeSet()};
$("rt").onclick=()=>{closeSet();if(window.Android&&Android.stock){Android.stock();return}const x=$("ex");x.classList.add("on");$("ext").textContent="Retour à l’interface d’origine…";$("exb").style.display="none";
 setTimeout(()=>{$("ext").textContent="Démo terminée. Cette page ne peut pas remplacer le système de ta TV : sur une vraie TV, cette option rendrait la main à l’interface d’origine.";$("exb").style.display="inline-block";$("exb").focus()},1800)};
$("exb").onclick=()=>$("ex").classList.remove("on");
let pv=false;try{pv=localStorage.getItem("rose-perf")==="1"}catch(e){}
setPerf(pv);
function tick(){const n=new Date(),h=n.getHours();
 $("hi").textContent=h<5||h>=18?"Bonsoir":h<12?"Bonjour":"Bon après-midi";
 $("hm").textContent=n.toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
 $("dt").textContent=n.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"})}
function net(){const o=navigator.onLine,cn=navigator.connection||{},T={wifi:"Wi-Fi",ethernet:"Ethernet",cellular:"Données mobiles"},
 kind=T[cn.type]||(cn.effectiveType?"connexion "+cn.effectiveType.toUpperCase():"");
 $("net").classList.toggle("on",o);$("net").textContent=o?"Connectée"+(kind?" · "+kind:" au réseau"):"Non connectée"}
addEventListener("online",net);addEventListener("offline",net);if(navigator.connection)navigator.connection.addEventListener("change",net);
tick();setInterval(tick,10000);net();
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(go);go();
</script>
</body>
</html>
